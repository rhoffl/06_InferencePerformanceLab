[project]
name = "inference-performance-lab"
version = "1.0.0"
description = "Reproducible LLM serving performance and quality benchmarks"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27",
  "pydantic>=2.8", "pydantic-settings>=2.4", "pyyaml>=6.0",
  "pandas>=2.2", "pyarrow>=17", "psutil>=6.0", "typer>=0.12",
  "streamlit>=1.38", "plotly>=5.24"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
inference-lab = "inference_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]

